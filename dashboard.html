<!DOCTYPE html>
<html>
<head>
<title>Eleven Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{background:#000;color:#0f0;font-family:monospace;padding:15px}
.header{border:1px solid #0f0;padding:10px;text-align:center;box-shadow:0 0 10px #0f0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-top:20px}
.card{border:1px solid #0f0;padding:15px;border-radius:8px;background:rgba(0,20,0,0.5)}
.card h3{margin-top:0;color:#fff}
button{width:100%;padding:8px;background:#0f0;color:#000;border:none;font-weight:bold;cursor:pointer;margin-top:10px}
input{width:90%;padding:8px;background:#000;border:1px solid #0f0;color:#0f0}
</style>
</head>
<body>
<div class="header">
<h2>⚡ ELEVEN SECURITY DASHBOARD ⚡</h2>
<p>Welcome Agent Ubaidullah | Status: ONLINE</p>
</div>

<div class="grid">
<div class="card">
<h3>📡 IP Tracker</h3>
<p id="ip">Click to trace...</p>
<button onclick="getIP()">TRACE IP</button>
</div>

<div class="card">
<h3>🔐 Pass Generator</h3>
<p id="pass">---</p>
<button onclick="genPass()">GENERATE</button>
</div>

<div class="card">
<h3>🌍 Location Tool</h3>
<input id="loc" placeholder="Enter IP / Username">
<p id="locRes"></p>
<button onclick="findLoc()">FIND</button>
</div>

<div class="card">
<h3>💀 System</h3>
<p>Server: GitHub<br>Access: Root<br>Mode: Educational</p>
<button onclick="window.location.href='index.html'">LOGOUT</button>
</div>
</div>

<script>
function getIP(){
document.getElementById('ip').innerHTML = "Fetching...";
fetch('https://api.ipify.org?format=json')
.then(r=>r.json())
.then(d=>{ document.getElementById('ip').innerHTML = "Your IP: " + d.ip + "<br>ISP: PTCL<br>City: Dir Upper (Approx)"; });
}
function genPass(){
let chars="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789@#$_";
let p=""; for(let i=0;i<12;i++) p+=chars[Math.floor(Math.random()*chars.length)];
document.getElementById('pass').innerText=p;
}
function findLoc(){
let v=document.getElementById('loc').value;
if(v=="") alert("Kuch likho!");
else document.getElementById('locRes').innerText = "Tracing "+v+"...\n[+] Location: Pakistan\n[+] Status: Found (Demo)";
}
</script>
</body>
</html>
